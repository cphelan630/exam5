[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reservingengine"]

[project]
name = "exam5"
version = "0.1.0"
description = "Actuarial analysis project for pricing and reserving"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "scikit-learn>=1.8.0",
    "chainladder>=0.9.1",
    "jinja2>=3.1.6",
    "ipykernel>=7.2.0",
    "pip>=26.0.1",
    "statsmodels>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "nbstripout",
]
exam5 = [
    "jupyter",
    "nbconvert",
]

[tool.uv.sources]
chainladder = { path = "chainladder-python", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
