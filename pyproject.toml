[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratingengine", "src/reservingengine"]

[project]
name = "exam5"
version = "0.1.0"
description = "Actuarial analysis project for pricing and reserving"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
exam5 = [
    "chainladder",
    "ipykernel",
    "jupyter",
    "matplotlib",
    "nbconvert",
    "seaborn",
]

[tool.uv.sources]
chainladder = { path = "chainladder-python", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
